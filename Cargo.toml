[package]
name = "sparc"
version = "0.4.0"
edition = "2024"
description = "Rust binding of the Sparc sparsity-based consensus algorithm for long erroneous sequencing reads"
license = "MIT"
repository = "https://github.com/keithyin/Sparc"
categories = ["science::bioinformatics", "external-ffi-bindings"]
keywords = ["bioinformatics", "consensus", "sequencing", "long-reads", "ffi"]
exclude = [
    ".vscode/*",
    "testdata/*",
    "testdata2/*",
    "utility/*",
    "*.txt",
    "*.dot",
    "DEBUG.consensus.fasta",
]

